name: Needs et Outputs

on:
  push:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest
    outputs:
      quality-code-version: ${{ steps.quality-code-version.outputs.quality-code-version }}
    steps:
      - name: récupérer le dépot
        uses: actions/checkout@v7
      - name: vérifier la qualité du code
        run: echo "vérif de la qualité du code"
      - name: linting du code
        run: echo "linting du code"
      - name: quality code version
        id: quality-code-version
        run: echo "quality-code-version=1.0" >> $GITHUB_OUTPUT
      - name: linting-code-version
        run: echo "la version de la qualité du code ${{steps.quality-code-version.output.quality-code-version}}"

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: récupérer le dépot
        uses: actions/checkout@v7
      - name: analyse
        run: echo "analyse en cours"


  test:
    runs-on: ubuntu-latest
    needs: [code-quality, static-analysis]
    steps:
      - name: récupérer le dépot
        uses: actions/checkout@v7
      - name: exécuter les test
        run: echo "tests en cours"
      - name: afficher la version de qualité du code
        run: echo "La version de la qualité du code {{ needs.code-quality.output.quality-code-version }}"

  
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: récupérer le dépot
        uses: actions/checkout@v7
      - name: construire le projet
        run: echo "construction du projet"